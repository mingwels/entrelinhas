:root{--bg:#18130f;--panel:#211a17;--paper:#e8dfcf;--muted:#a69a8b;--line:#453831;--plum:#835479;--rust:#b47b59;--glow:#ddd1bd;--sans:'DM Sans',sans-serif;--serif:'IM Fell English',Georgia,serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% 0%,#30201f 0%,var(--bg) 46%);color:var(--paper);font-family:var(--sans);font-size:14px;min-height:100vh}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #bd8baa;outline-offset:3px}.layout{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#17120f;border-right:1px solid #3b302a;padding:31px 21px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{font:italic 27px var(--serif);letter-spacing:.3px;color:#ebdfd0}.brand b{color:#a379a1;font-weight:400}.side-kicker{font-size:9px;letter-spacing:2px;color:#a88d77;margin:49px 0 14px}.nav{border:0;background:none;text-align:left;color:#b4a89a;padding:13px 12px;border-radius:3px;margin:3px 0;display:flex;align-items:center;gap:12px;font-size:12px}.nav.active,.nav:hover{background:#2a211e;color:#e9d7c3}.nav .count{margin-left:auto;font-size:10px;color:#c79b81}.motto{margin:auto 8px;color:#bcae9f}.motto span{font-size:31px;color:#a379a1}.motto p{font:italic 26px/1.25 var(--serif)}.motto small{font-size:10px;color:#8c8074;line-height:1.7}.profile{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;display:flex;gap:10px;align-items:center;font-size:12px}.seal{width:33px;height:33px;border:1px solid #735c68;border-radius:50%;display:grid;place-items:center;color:#c5a0ba;font:italic 19px var(--serif)}.profile small{display:block;color:#8f8275;font-size:9px;margin-top:4px}main{min-width:0}.bar{height:66px;border-bottom:1px solid #392f29;display:flex;align-items:center;justify-content:space-between;padding:0 4.5vw;color:#aa9c8d;font-size:10px;letter-spa lor:#897b68;font-size:9px;border-bottom:1px solid #cfc4b1;padding-bottom:15px}.poem{font:20px/1.84 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;padding:29px 0 45px}.provenance{border-top:1px solid #cfc4b1;padding-top:14px;font-size:9px;color:#776a5a;line-height:1.8}.aside h4{font-size:8px;letter-spacing:1.6px;color:#a7898e;margin:0 0 13px}.aside h4:not(:first-child){margin-top:27px}.act{font:16px/1.35 var(--serif);color:#cab7a7;border-bottom:1px solid #483b34;padding:9px 0}.aside p{font-size:10px;line-height:1.8;color:#9e9082}.notice{border-left:3px solid #b08775;background:#2b211d;color:#cbb39a;padding:12px 14px;margin:15px 0;font-size:10px}.editor{background:#211a17;border:1px solid #493b32;padding:22px;margin:15px 0}.editor h3{font:23px var(--serif);font-weight:400;margin:0 0 10px}.editor textarea,.editor input,.modal textarea,.modal input,.modal select{width:100%;background:#18130f;border:1px solid #4b3c33;color:#e1d5c3;padding:11px;font-size:11px;line-height:1.8;margin:8px 0;resize:vertical}.editor textarea{min-height:190px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison article{min-width:0;border:1px solid #463a32}.comparison select{width:100%;padding:11px;background:#211a17;color:#cabbab;border:0;border-bottom:1px solid #463a32}.diff{font:15px/1.8 var(--serif);white-space:pre-wrap;padding:15px;color:#d9cbb9;overflow-wrap:anywhere}.empty{text-align:center;padding:45px;color:#968979}.timeline{display:grid;grid-template-columns:1fr 300px;gap:35px}.year{display:grid;grid-template-columns:55px 1fr 60px;gap:12px;align-items:center;margin:20px 0;font-size:10px;color:#998b7c}.track{height:7px;background:#2c2520}.track span{display:block;height:100%;background:#906b87}.row{width:100%;display:flex;gap:15px;padding:13px 0;border:0;border-bottom:1px solid #3d322c;background:none;text-align:left;align-items:center;font:18px var(--serif)}.row small{font:9px var(--sans);color:# </style></head><body><div id="app"></div><script src="works.js"></script><script>
const BASE=window.AUTHORAL_WORKS||[];let works=JSON.parse(localStorage.getItem('entrelinhas-publico')||'null')||structuredClone(BASE),view='Biblioteca',selected='',tab='Transcrição',query='',theme='',year='',act='',kind='Todos',modal=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function save(){localStorage.setItem('entrelinhas-publico',JSON.stringify(works));toast('Salvo neste navegador. Exporte JSON para levar suas alterações ao site publicado.')}function toast(s){let x=$('.toast');x.textContent=s;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),3600)}function d(s){return s&&/^\d{4}-\d\d-\d\d$/.test(s)?s.split('-').reverse().join('/'):(s||'Data não confirmada')}function go(v){view=v;selected='';history.replaceState(null,'',location.pathname);render()}function open(id){selected=id;tab='Transcrição';render();scrollTo(0,0)}function changeTab(t){tab=t;render()}function patch(id,key,value){works=works.map(w=>w.id===id?{...w,[key]:value}:w);save()}function addText(){modal='new';render()}function newVersion(){modal='version';render()}function newJournal(){modal='journal';render()}function render(){const app=$('#app'),w=works.find(x=>x.id===selected),themes=[...new Set(works.flatMap(x=>x.themes))].sort(),years=[...new Set(works.map(x=>x.date.slice(0,4)).filter(Boolean))].sort().reverse(),shown=works.filter(x=>(!query||slug(x.title+' '+x.acts.join(' ')).includes(slug(query)))&&(!theme||x.themes.includes(theme))&&(!year||(year==='none'?!x.date:x.date.startsWith(year)))&&(!act||x.acts.some(a=>a.startsWith(act+'.')))&&(kind==='Todos'||(kind==='Fragmentos'?x.kind==='Fragmento':x.kind==='Obra'))).sort((a,b)=>b.date.localeCompare(a.date));
app.innerHTML=`<div class="layout"><aside class="side"><div class="brand">entrelinhas<b>.</b></div><div class="side-kicker">ACERVO AUTORAL</div><nav><button class="nav ${view==='Biblioteca'&&!w?'active':''}" onclick="go('Biblioteca')">▤ Biblioteca <span class="count">${works.length}</span></button><button class="nav ${view==='Versões'?'active':''}" onclick="go('Versões')">◈ Versões</button><button class="nav ${view==='Evolução'?'active':''}" onclick="go('Evolução')">⌁ Evolução</button></nav><div class="motto"><span>✳</span><p>palavras<br>que ficam<br><i>acordadas.</i></p><small>O que você escreveu<br>também escreve você.</small></div><div class="profile"><div class="seal">M</div><div>Miguel<small>arquivo público</small></div></div></aside><main><header class="bar"><span>ENTRELINHAS　/　<b>${esc(w?.title||view)}</b></span><div class="bar-right"><span class="status">● Salvo neste navegador</span><button onclick="exportAll()">Exportar acervo</button><button onclick="document.querySelector('#importfile').click()">Importar</button><input id="importfile" type="file" accept="application/json" class="hide" onchange="importAll(this)"></div></header>${w?detail(w):!selected&&view==='Biblioteca'?library(shown,themes,years):view==='Versões'?versionsPage():evolution()}<footer class="footer"><span>ENTRELINHAS · MIGUEL</span><span>um arquivo em movimento</span><span>EDIÇÃO LIVRE · CÓDIGO ABERTO</span></footer></main></div><div class="toast hide"></div>${modal?modalHTML():''}`;if(tab==='Comparar'&&w&&w.versions.length>1)updateCompare()}
function library(list,themes,years){return `<section class="hero"><div class="eyebrow">✦ UM ARQUIVO EM MOVIMENTO</div><h1>O que fica<br><i>entre as linhas.</i></h1><p>Seus textos em um só lugar. Releia, compare, acrescente notas. Um acervo que acompanha a sua voz.</p><button class="primary" onclick="addText()">＋　Novo texto</button></section><section class="stats"><div class="stat"><strong>${String(works.length).padStart(2,'0')}</strong><span>textos no acervo</span></div><div class="stat"><strong>${String(works.filter(x=>x.kind==='Fragmento'||x.status==='Parcial').length).padStart(2,'0')}</strong><span>registros parciais</span></div><div class="stat"><strong>${String(works.reduce((n,x)=>n+x.versions.filter(v=>v.type==='Revisão').length,0)).padStart(2,'0')}</strong><span>revisões suas</span></div><em>arquivo aberto · em permanente construção</em></section><section class="library"><div class="section-head"><div><div class="eyebrow">ENTRE PÁGINAS E POSSIBILIDADES</div><h2>Sua biblioteca <span class="pill">${list.length}</span></h2></div><div class="seg">${['Todos','Obras','Fragmentos'].map(x=>`<button class="${kind===x?'on':''}" onclick="kind='${x}';render()">${x}</button>`).join('')}</div></div><div class="filters"><input aria-label="Buscar" placeholder="Buscar por título ou ato…" value="${esc(query)}" oninput="query=this.value;const y=scrollY,pos=this.selectionStart;render();const el=document.querySelector('[aria-label=Buscar]');el.focus();el.setSelectionRange(pos,pos);scrollTo(0,y)"><select aria-label="Tema" onchange="theme=this.value;render()"><option value="">Todos os temas</option>${themes.map(t=>`<option ${theme===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select aria-label="Data" onchange="year=this.value;render()"><option value="">Todas as datas</option>${years.map(t=>`<option ${year===t?'selected':''}>${t}</option>`).join('')}<option value="none" ${year==='none'?'selected':''}>Data não confirmada</option></select><select aria-label="Ato" onchange="act=this.value;render()"><option value="">Todos os atos</option>${['I','II','III','IV','V','VI'].map(t=>`<option value="${t}" ${act===t?'selected':''}>Ato ${t}</option>`).join('')}</select></div><div class="grid">${list.map((x,i)=>`<button class="card" onclick="open('${x.id}')"><div class="card-top"><span>✧ ${x.kind.toUpperCase()}</span><span>↗</span></div><div class="card-body"><small>${esc(d(x.date))}</small><h3>${esc(x.title)}</h3><p>${esc(x.acts.length?x.acts.length+' atos catalogados':x.versions[0]?.text.split('\n').filter(Boolean).slice(0,2).join(' / ')||'Adicionar texto')}</p></div><div class="card-bottom"><span class="tag">${esc(x.themes[0]||'Sem tema')}</span><span>${x.status==='Parcial'?'Registro parcial':x.versions.length+' versão'}</span></div></button>`).join('')}</div>${list.length?'':'<div class="empty">Nenhum texto encontrado. Tente outro filtro.</div>'}<p class="source-note">Acervo montado com base nas transcrições e registros disponíveis até 23/10/2026. Datas de envio não foram tratadas como datas de escrita. Temas são etiquetas editoriais, editáveis por você.</p></section>`}
function detail(w){let wanted=tab==='Revisão'?'Revisão':'Transcrição',v=w.versions.findLast(x=>x.type===wanted)||(tab==='Transcrição'?w.versions[0]:null);return `<section class="detail"><button class="back" onclick="go('Biblioteca')">← VOLTAR À BIBLIOTECA</button><div class="detailhead"><div><div class="eyebrow">${w.kind.toUpperCase()} · ${w.status.toUpperCase()}</div><h1>${esc(w.title)}</h1><div class="muted">${esc(w.dateLabel)}</div><div class="tags">${w.themes.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><button class="primary" onclick="newVersion()">＋　Nova versão</button></div>${w.status==='Parcial'?'<div class="notice">Registro parcial. As lacunas permanecem abertas; nenhum verso ausente foi reconstruído.</div>':''}<div class="tabs">${['Transcrição','Revisão','Análise','Notas','Comparar'].map(t=>`<button class="${tab===t?'sel':''}" onclick="changeTab('${t}')">${t}</button>`).join('')}</div>${tab==='Transcrição'||tab==='Revisão'?`<div class="reader"><article class="paper"><div class="paper-top"><span>${esc(v?.label||'Sem versão')}</span><span>${d(v?.date)}</span></div>${v?`<div class="poem">${esc(v.text)}</div><div class="provenance">ORIGEM · ${esc(v.source||'Incluído por Miguel')}<br>O registro preserva o texto catalogado; revisões novas são identificadas separadamente.</div>`:`<div class="empty">Nenhuma revisão registrada. Clique em Nova versão para adicionar.</div>`}</article><aside class="aside"><h4>ESTRUTURA</h4>${w.acts.length?w.acts.map(x=>`<div class="act">${esc(x)}</div>`).join(''):'<p>Texto independente.</p>'}<h4>VERSÕES DISPONÍVEIS</h4>${w.versions.map(x=>`<p>${esc(x.label)} · ${d(x.date)}</p>`).join('')}<h4>REGISTRO</h4><p>Fonte e estado incompleto documentados na ficha. Você pode editar metadados em Notas.</p></aside></div>`:tab==='Análise'?`<div class="cols"><section class="editor"><div class="eyebrow">01 · EXPLÍCITO</div><h3>O que está dito</h3><p class="muted">Edite ou complemente a análise sem misturá-la ao texto.</p><textarea aria-label="Explícito" onblur="patch('${w.id}','explicit',this.value)">${esc(w.explicit)}</textarea></section><section class="editor"><div class="eyebrow">02 · IMPLÍCITO</div><h3>O que fica nas entrelinhas</h3><p class="muted">Registre suas próprias leituras e identifique a interpretação.</p><textarea aria-label="Implícito" onblur="patch('${w.id}','implicit',this.value)">${esc(w.implicit)}</textarea></section></div>`:tab==='Notas'?notes(w):tab==='Comparar'?compare(w):''}</section>`}
function notes(w){return `<div class="cols"><section><div class="editor"><h3>Notas de margem</h3><textarea onblur="patch('${w.id}','notes',this.value)" aria-label="Notas">${esc(w.notes)}</textarea></div><div class="editor"><h3>Referências</h3><textarea aria-label="Referências" onblur="patch('${w.id}','references',this.value.split('\n').filter(Boolean))">${esc(w.references.join('\n'))}</textarea></div><div class="editor"><h3>Ficha editável</h3><label>Título<input value="${esc(w.title)}" onchange="patch('${w.id}','title',this.value)"></label><label>Data de escrita<input value="${esc(w.date)}" placeholder="AAAA-MM-DD" onchange="patch('${w.id}','date',this.value)"></label><label>Contexto da data<input value="${esc(w.dateLabel)}" onchange="patch('${w.id}','dateLabel',this.value)"></label><label>Temas separados por vírgula<input value="${esc(w.themes.join(', '))}" onchange="patch('${w.id}','themes',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></label><label>Atos, um por linha<textarea onchange="patch('${w.id}','acts',this.value.split('\n').filter(Boolean))">${esc(w.acts.join('\n'))}</textarea></label></div></section><aside class="journal"><h3>Diário do processo</h3><p>Registre mudanças e descobertas suas, ao longo do tempo.</p><button class="primary" onclick="newJournal()">＋ Anotar descoberta</button>${(w.events||[]).map(x=>`<p><b>${d(x.date)}</b><br>${esc(x.text)}</p>`).join('')}</aside></div>`}
function updateCompare(){const w=works.find(x=>x.id===selected);if(!w)return;const vs=[0,1].map(i=>w.versions.find(v=>v.id===document.querySelector('#v'+i)?.value));[0,1].forEach(i=>{const box=document.querySelector('#t'+i);if(!box)return;const other=(vs[1-i]?.text||'').split('\n');box.innerHTML=(vs[i]?.text||'').split('\n').map(line=>`<div style="background:${line&&!other.includes(line)?(i?'#29402a':'#4b2929'):'transparent'}">${esc(line)||' '}</div>`).join('')})}
function compare(w){if(w.versions.length<2)return `<div class="empty"><h3>Comece com outra versão.</h3><p>Esta obra precisa de dois registros para comparar.</p><button class="primary" onclick="newVersion()">＋ Nova versão</button></div>`;return `<div class="comparison">${[0,1].map(i=>`<article><select onchange="updateCompare()" aria-label="Versão ${i+1}" id="v${i}">${w.versions.map((v,n)=>`<option value="${v.id}" ${n===(i?w.versions.length-1:0)?'selected':''}>${esc(v.label)} · ${d(v.date)}</option>`).join('')}</select><div class="diff" id="t${i}"></div></article>`).join('')}</div><p class="muted">Linhas exclusivas: vermelho à esquerda e verde à direita. Deslocamentos não são destacados.</p>`}
function versionsPage(){return `<section class="workspace"><div class="eyebrow">A ESCRITA NUNCA É UMA SÓ</div><h1>Entre uma versão<br><i>e outra, você.</i></h1><p class="muted">Compare os registros guardados. Acrescente revisões com o texto que você decidir.</p>${works.map(w=>`<button class="row" onclick="open('${w.id}');setTimeout(()=>changeTab('Comparar'),0)"><small>${w.versions.length} registros</small><span>${esc(w.title)}</span><b>↗</b></button>`).join('')}</section>`}
function evolution(){let years=[...new Set(works.map(x=>x.date.slice(0,4)).filter(Boolean))].sort();return `<section class="workspace"><div class="eyebrow">SEU PERCURSO EM PALAVRAS</div><h1>Olhar para trás.<br><i>Escrever adiante.</i></h1><p class="muted">Linha do tempo baseada nas datas registradas. Períodos sem data de escrita confirmada ficam fora do gráfico.</p><div class="timeline"><section><h2>Ao longo dos anos</h2>${years.map(y=>{let n=works.filter(w=>w.date.startsWith(y)).length,max=Math.max(...years.map(z=>works.filter(w=>w.date.startsWith(z)).length));return `<div class="year"><b>${y}</b><div class="track"><span style="width:${100*n/max}%"></span></div><span>${n} textos</span></div>`}).join('')}<h2 style="margin-top:40px">Cronologia</h2>${works.filter(w=>w.date).sort((a,b)=>a.date.localeCompare(b.date)).map(w=>`<button class="row" onclick="open('${w.id}')"><small>${d(w.date)}</small><span>${esc(w.title)}</span>↗</button>`).join('')}</section><aside class="journal"><h3>Diário de processo</h3><p>Abra uma obra e registre descobertas na aba Notas. Seu percurso muda junto com a escrita.</p></aside></div></section>`}
function modalHTML(){let title=modal==='new'?'Adicionar texto':modal==='version'?'Guardar nova versão':'Registrar descoberta';return `<div class="modalbg" onclick="modal=null;render()"><section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><button class="close" onclick="modal=null;render()">×</button><div class="eyebrow">UM NOVO REGISTRO</div><h2>${title}</h2><form onsubmit="submitModal(event)">${modal==='new'?'<label>Título<input id="mt" required></label>':''}${modal==='version'?'<label>Nome da versão<input id="ml" required placeholder="Ex.: revisão de novembro"></label>':''}<div class="cols"><label>Data<input id="md" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>${modal!=='journal'?`<label>Tipo<select id="my">${(modal==='new'?['Obra','Fragmento']:['Revisão','Transcrição','Fragmento']).map(x=>`<option>${x}</option>`).join('')}</select></label>`:''}</div><label>${modal==='journal'?'Descoberta': 'Texto'}<textarea id="mx" required></textarea></label><button class="primary">Adicionar ao acervo</button></form></section></div>`}
function submitModal(e){e.preventDefault();let date=$('#md').value,text=$('#mx').value;if(modal==='new'){let item={id:crypto.randomUUID(),title:$('#mt').value,date,dateLabel:d(date)+' · informado pelo autor',kind:$('#my').value,status:'Transcrição disponível',themes:[],acts:[],versions:[{id:crypto.randomUUID(),label:'Primeiro registro',text,date,source:'Adicionado por Miguel',type:$('#my').value}],explicit:'',implicit:'',notes:'',references:[],events:[]};works.unshift(item);selected=item.id;view='Biblioteca'}else{let w=works.find(x=>x.id===selected);if(modal==='journal')w.events.push({date,text});else w.versions.push({id:crypto.randomUUID(),label:$('#ml').value,text,date,source:'Adicionado por Miguel',type:$('#my').value});}modal=null;save();render()}
function exportAll(){let b=new Blob([JSON.stringify(works,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='entrelinhas-meu-acervo.json';a.click();URL.revokeObjectURL(a.href)}function importAll(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;works=j;save();render()}catch{alert('Arquivo JSON do acervo inválido.')}};r.readAsText(f)}render();
</script></body></html>
